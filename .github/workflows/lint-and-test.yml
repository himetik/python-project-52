name: Lint and Test

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ 3.11 ]

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: database
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: unsecret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          uv self update

      - name: Install dependencies
        run: |
          python -m venv .venv
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
          .venv/bin/pip install --upgrade pip
          uv pip install .

      - name: Run linter
        run: |
          .venv/bin/ruff check .

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres && \
            PGPASSWORD=unsecret psql -h localhost -U postgres -d database -c "SELECT 1" > /dev/null 2>&1; do
              echo "Waiting for PostgreSQL...";
              sleep 2;
          done 

      - name: Test & publish code coverage
        uses: paambaati/codeclimate-action@v3.2.0
        if: github.ref_name == 'trunk'
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
          DATABASE_URL: 'postgresql://postgres:011235!@localhost:5432/database'
          SECRET_KEY: open
        with:
          coverageCommand: sh -c ".venv/bin/coverage run --source='.' manage.py test; .venv/bin/coverage xml"
          debug: true
