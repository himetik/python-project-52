{% extends "base.html" %}
{% load django_bootstrap5 i18n %}

{% block content %}
<div class="container wrapper flex-grow-1">
    <h1 class="my-4">
        {% trans 'Labels' %}
    </h1>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>{% trans 'Name' %}</th>
            <th>{% trans 'Date and time of creation' %}</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>{{ label.id }}</td>
            <td>{{ label }}</td>
            <td>{{ label.created_at }}</td>
        </tr>
        </tbody>
    </table>
</div>
{% endblock %}
